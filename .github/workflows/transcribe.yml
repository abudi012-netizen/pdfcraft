name: transcribe-test
on:
  push:
    branches: [transcribe-test]
permissions:
  contents: write
jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p k
          openssl genrsa -out k/runner_priv.pem 3072
          openssl rsa -in k/runner_priv.pem -pubout -out runner_pub.pem
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git add runner_pub.pem; git commit -m "temp: runner public key [skip ci]"; git push
      - uses: actions/cache/save@v4
        with: { path: k, key: runner-key-v2 }
